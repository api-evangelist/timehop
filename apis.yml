name: Timehop
description: >-
  Timehop is a consumer mobile application that resurfaces a person's past
  photos, videos, and social media posts as daily "memories," letting people
  celebrate what they were doing on this day one, five, or more years ago.
  It aggregates content from a user's camera roll and connected social
  accounts and presents it back on a nostalgic timeline. Timehop is made by
  Sincere Corporation, a family of consumer brands that also includes
  Punchbowl, Lovebird, and Memento. Timehop ships as iOS and Android apps and
  does not publish a public developer API, developer portal, or API
  documentation; this profile captures the company's public web presence for
  the API Evangelist network.
